<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Oxford Redirect</title>
    <script>
        // Получаем слово из хеша (#word)
        const hash = window.location.hash;
        const word = hash ? hash.substring(1) : '';
        
        if (word) {
            window.location.replace(
                `https://www.oxfordlearnersdictionaries.com/definition/english/${word.toLowerCase()}`
            );
        }
    </script>
</head>
<body>Redirecting...</body>
</html>
